# DigitalOcean App Platform — Dockerfile deploy, single instance.
# After the GitHub repo exists, set github.repo to OWNER/leaderboard and run:
#   doctl apps create --spec .do/app.yaml
#
# Or let GitHub Actions deploy via digitalocean/app_action (see .github/workflows/deploy.yml).
name: leaderboard
region: nyc

services:
  - name: api
    dockerfile_path: Dockerfile
    # Filled in by scripts/do-create.sh / after gh repo create:
    github:
      repo: REPLACE_OWNER/leaderboard
      branch: main
      # CI/CD deploys via GitHub Actions (.github/workflows/deploy.yml).
      deploy_on_push: false
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: SCORE_MIN
        value: "-1000000000"
      - key: SCORE_MAX
        value: "1000000000"
      - key: TOP_DEFAULT
        value: "10"
      - key: TOP_MAX
        value: "100"
      - key: WINDOW_DEFAULT
        value: "1"
      - key: WINDOW_MAX
        value: "25"
      - key: ID_MAX_LEN
        value: "64"
    # Optional write auth — set in DO dashboard or:
    # doctl apps update … with secret API_KEY
    # - key: API_KEY
    #   type: SECRET
    #   value: "…"

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /
