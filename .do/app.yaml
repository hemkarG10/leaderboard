# DigitalOcean App Platform — image from DOCR (built by GitHub Actions).
name: leaderboard
region: nyc

services:
  - name: api
    image:
      registry_type: DOCR
      registry: leaderboard-reg
      repository: leaderboard
      tag: latest
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 6
    envs:
      - key: SCORE_MIN
        value: "-1000000000"
      - key: SCORE_MAX
        value: "1000000000"
      - key: TOP_DEFAULT
        value: "10"
      - key: TOP_MAX
        value: "100"
      - key: WINDOW_DEFAULT
        value: "1"
      - key: WINDOW_MAX
        value: "25"
      - key: ID_MAX_LEN
        value: "64"

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /
