name: Deploy DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com/leaderboard-reg
  IMAGE: registry.digitalocean.com/leaderboard-reg/leaderboard

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update App Platform app
        run: |
          set -euo pipefail
          APP_ID="$(doctl apps list -o json | python3 -c '
          import json,sys
          apps=json.load(sys.stdin)
          for a in apps:
              if a.get("spec",{}).get("name")=="leaderboard":
                  print(a["id"]); break
          ')"
          if [ -n "${APP_ID}" ]; then
            echo "Updating app ${APP_ID}"
            doctl apps update "${APP_ID}" --spec .do/app.yaml
            doctl apps create-deployment "${APP_ID}" --force-rebuild
          else
            echo "Creating app"
            doctl apps create --spec .do/app.yaml
          fi

      - name: Print live URL
        run: |
          doctl apps list --format ID,Spec.Name,DefaultIngress
          doctl apps list -o json | python3 -c '
          import json,sys
          for a in json.load(sys.stdin):
              print("live_url:", a.get("live_url") or a.get("default_ingress"))
              print("phase:", (a.get("active_deployment") or {}).get("phase"))
              print("building:", (a.get("in_progress_deployment") or {}).get("phase"))
          '
